# CodeQL as a workflow file (advanced setup), not GitHub's default setup, so
# the required check on development has one known name: `CodeQL`. Do not also
# enable default setup in the repo settings; the two conflict.
name: CodeQL

on:
  pull_request:
    branches: [development, production]
  push:
    branches: [development, production]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  CodeQL:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config: |
            paths-ignore:
              - screenshots
              - coverage
              - node_modules

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
